name: Supabase keep-alive

# Le plan gratuit Supabase met un projet en pause après 7 jours sans requête API.
# Ce workflow envoie une requête de lecture légère et publique (table `services`)
# une fois par jour pour maintenir le projet actif.

on:
  schedule:
    - cron: '0 8 * * *' # tous les jours à 08:00 UTC
  workflow_dispatch: {} # déclenchement manuel depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Nettoie les valeurs des secrets : supprime CR/LF et espaces en début/fin
          # (fréquent quand la valeur est collée depuis un environnement Windows),
          # sinon curl échoue avec "Malformed input to a URL function".
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n' | xargs)"
          SUPABASE_ANON_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '\r\n' | xargs)"
          SUPABASE_URL="${SUPABASE_URL%/}"

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL et SUPABASE_ANON_KEY doivent être configurés dans les secrets du dépôt (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          curl --fail --silent --show-error \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/services?select=id&limit=1"
