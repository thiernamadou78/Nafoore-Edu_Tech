name: Supabase keep-alive

# Le plan gratuit Supabase met un projet en pause après une période d'inactivité
# jugée insuffisante. Un ping quotidien unique s'est révélé insuffisant (avertissement
# reçu malgré des exécutions quotidiennes réussies) : ce workflow tape maintenant sur
# plusieurs tables publiques et tourne toutes les 6h pour générer une activité plus
# consistante.

on:
  schedule:
    - cron: '0 */6 * * *' # toutes les 6h (00h, 06h, 12h, 18h UTC)
  workflow_dispatch: {} # déclenchement manuel depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Nettoie les valeurs des secrets : supprime CR/LF et espaces en début/fin
          # (fréquent quand la valeur est collée depuis un environnement Windows),
          # sinon curl échoue avec "Malformed input to a URL function".
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n' | xargs)"
          SUPABASE_ANON_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '\r\n' | xargs)"
          SUPABASE_URL="${SUPABASE_URL%/}"

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL et SUPABASE_ANON_KEY doivent être configurés dans les secrets du dépôt (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          for table in services testimonials faq_items; do
            echo "Ping $table..."
            curl --fail --silent --show-error \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/$table?select=id&limit=1"
            echo ""
          done
